name: Reanalysis code smoke tests (synthetic only)
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic test suite; no third-party raw annotations
        run: python -m unittest discover -s tests -v
