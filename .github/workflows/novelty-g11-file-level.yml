name: G11 file-level reference execution challenge
on:
  push:
    branches: [novelty-g11-regression-contract]
    paths: ['novelty_g11/file_level_partition.py','novelty_g11/run_file_contract.py','.github/workflows/novelty-g11-file-level.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-contract:
    strategy:
      fail-fast: false
      matrix:
        case: [sphinx_a,sphinx_b]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pyarrow==22.0.0
      - name: Full reference test-file collection
        run: |
          mkdir -p /tmp/g11_file_out
          python novelty_g11/run_file_contract.py --case ${{ matrix.case }} --root /tmp/g11_data --out /tmp/g11_file_out/aggregate.json
      - if: always()
        run: rm -rf /tmp/g11_data
      - uses: actions/upload-artifact@v4
        with:
          name: G11-file-${{ matrix.case }}
          path: /tmp/g11_file_out/
          if-no-files-found: error
