name: G14 aggregate evidence and claim lock
on:
  push:
    branches: [novelty-g14-evidence-lock]
    paths: ['novelty_g14/**', '.github/workflows/novelty-g14-lock.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python novelty_g14/verify_claims.py --out /tmp/g14/verified_evidence_lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: G14-aggregate-evidence-lock
          path: /tmp/g14/
          if-no-files-found: error
