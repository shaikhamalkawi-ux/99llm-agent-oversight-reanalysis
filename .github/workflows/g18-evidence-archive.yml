name: G18 portable verified evidence archive
on:
  push:
    branches: [production-g18-evidence-archive]
    paths: ['.github/workflows/g18-evidence-archive.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify locked aggregate evidence and create portable archive
        run: |
          set -eu
          python novelty_g14/verify_claims.py --out /tmp/g18_recheck.json
          mkdir -p /tmp/g18_evidence
          cp -a novelty_g6 novelty_g7 novelty_g8 novelty_g9 novelty_g10 novelty_g11 novelty_g12 novelty_g13 novelty_g14 /tmp/g18_evidence/
          cp /tmp/g18_recheck.json /tmp/g18_evidence/
          cd /tmp/g18_evidence
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/G18_EVIDENCE_SHA256SUMS.txt
          cp /tmp/G18_EVIDENCE_SHA256SUMS.txt SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo 'G18 aggregate source bundle PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: G18-portable-aggregate-evidence
          path: /tmp/g18_evidence/
          if-no-files-found: error
