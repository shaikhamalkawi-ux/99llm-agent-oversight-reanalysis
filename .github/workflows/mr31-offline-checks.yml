name: MR31 derived-artifact offline QA
on:
  push:
    paths:
      - 'mr31/**'
      - '.github/workflows/mr31-offline-checks.yml'
  pull_request:
    paths:
      - 'mr31/**'
      - '.github/workflows/mr31-offline-checks.yml'
jobs:
  test-derived-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check archived-derived counts and exact frontier
        run: python -m unittest discover -s mr31/tests -p 'test_*.py' -v
      - name: Install figure rendering dependencies
        run: python -m pip install -r mr31/code/requirements.txt
      - name: Regenerate figures from frozen derived inputs
        run: |
          python mr31/code/build_new_results.py
          python mr31/code/build_revised_figures.py
      - name: Check six generated vector pairs exist
        run: |
          for f in F1_Completion_Frontier_Clear F2_Eligibility_And_Bounds_Clear S1_Exact_Budget_Clear_119_120 N1_Visibility_And_Unknown N2_Matched_Session_Ties N3_Repository_Resampling; do
            test -s "mr31/proposed/${f}.pdf"
            test -s "mr31/proposed/${f}.svg"
          done
