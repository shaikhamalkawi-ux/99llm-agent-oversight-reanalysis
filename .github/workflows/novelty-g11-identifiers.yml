name: G11 exact identifier representation challenge
on:
  push:
    branches: [novelty-g11-regression-contract]
    paths: ['novelty_g11/identifier_diagnostics.py','novelty_g11/run_identifier_diagnostics.py','.github/workflows/novelty-g11-identifiers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pyarrow==22.0.0
      - name: Identifier diagnostic on fixed source case
        run: |
          mkdir -p /tmp/g11_id_out
          python novelty_g11/run_identifier_diagnostics.py --case sphinx_b --root /tmp/g11_data --out /tmp/g11_id_out/aggregate.json
      - if: always()
        run: rm -rf /tmp/g11_data
      - uses: actions/upload-artifact@v4
        with:
          name: G11-identifier-aggregate
          path: /tmp/g11_id_out/
          if-no-files-found: error
